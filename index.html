<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WXZ Dump</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #07090c;
      --ink: #e8eef6;
      --muted: #8b9bb0;
      --steel: #b7c4d0;
      --surface: rgba(19, 22, 27, 0.72);
      --border: rgba(183, 196, 208, 0.14);
      --border-strong: rgba(183, 196, 208, 0.28);
      --accent: #6f9e7c;
      --accent-dim: rgba(111, 158, 124, 0.18);
      --danger: #c45c5c;
      --glow: rgba(111, 158, 124, 0.35);
      --radius: 16px;
      --font: "Inter", system-ui, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; font-family: var(--font); color: var(--ink); background: var(--bg); }
    body { overflow-x: hidden; }

    .bg-video {
      position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
    }
    .bg-video video {
      width: 100%; height: 100%; object-fit: cover;
      filter: grayscale(1) brightness(0.38) contrast(1.12); transform: scale(1.03);
    }
    .bg-overlay {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 80% 55% at 50% 0%, rgba(111, 158, 124, 0.1), transparent 55%),
        linear-gradient(180deg, rgba(7,9,12,0.5) 0%, rgba(7,9,12,0.78) 50%, rgba(7,9,12,0.94) 100%);
    }

    .app {
      position: relative; z-index: 1; max-width: 1180px;
      margin: 0 auto; padding: 24px 18px 40px;
    }

    header.top {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; margin-bottom: 22px; flex-wrap: wrap;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark {
      width: 40px; height: 40px; border-radius: 11px;
      background: linear-gradient(145deg, rgba(111,158,124,0.35), rgba(19,22,27,0.9));
      border: 1px solid var(--border-strong);
      display: grid; place-items: center; font-weight: 700; color: var(--accent);
      box-shadow: 0 0 20px var(--glow); font-size: 0.85rem;
    }
    .brand h1 { font-size: 1.2rem; font-weight: 700; letter-spacing: -0.02em; }

    .right-tools { display: flex; align-items: center; gap: 8px; }
    .badge {
      font-size: 0.7rem; font-weight: 600; letter-spacing: 0.06em;
      padding: 6px 11px; border-radius: 999px; border: 1px solid var(--border);
      background: var(--surface); color: var(--steel); backdrop-filter: blur(12px);
      text-transform: uppercase;
    }
    .badge.live { border-color: rgba(111,158,124,0.4); color: var(--accent); background: var(--accent-dim); }
    .icon-btn {
      appearance: none; border: 1px solid var(--border); background: var(--surface);
      color: var(--steel); width: 36px; height: 36px; border-radius: 10px;
      cursor: pointer; display: grid; place-items: center; font-size: 0.95rem;
      backdrop-filter: blur(12px); transition: 0.15s;
    }
    .icon-btn:hover { border-color: var(--border-strong); color: var(--ink); }
    .icon-btn.on { color: var(--accent); border-color: rgba(111,158,124,0.45); background: var(--accent-dim); }

    .glass {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius);
      backdrop-filter: blur(18px) saturate(1.15);
      -webkit-backdrop-filter: blur(18px) saturate(1.15);
      box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 18px 44px rgba(0,0,0,0.32);
    }
    .panel { padding: 18px; margin-bottom: 14px; }
    .panel-title {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px;
    }
    .panel-title h2 { font-size: 0.88rem; font-weight: 600; }
    .panel-title span { font-size: 0.72rem; color: var(--muted); }

    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 800px) { .row { grid-template-columns: 1fr; } }

    label.field-label {
      display: block; font-size: 0.72rem; font-weight: 500;
      color: var(--muted); margin-bottom: 7px;
    }
    input[type="url"], textarea {
      width: 100%; font: inherit; color: var(--ink);
      background: rgba(7,9,12,0.55); border: 1px solid var(--border);
      border-radius: 11px; padding: 11px 13px; outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus, textarea:focus {
      border-color: rgba(111,158,124,0.5);
      box-shadow: 0 0 0 3px rgba(111,158,124,0.12);
    }
    textarea {
      font-family: var(--mono); font-size: 0.78rem; line-height: 1.55;
      resize: none;
      height: 280px;
      max-height: 280px;
      overflow-y: auto;
      overflow-x: auto;
      white-space: pre;
      tab-size: 2;
    }
    textarea.output {
      height: 320px;
      max-height: 320px;
      background: rgba(5,7,10,0.72);
    }

    .dropzone {
      border: 1.5px dashed var(--border-strong); border-radius: 12px;
      padding: 22px 14px; text-align: center; background: rgba(7,9,12,0.35);
      cursor: pointer; transition: 0.15s;
    }
    .dropzone:hover, .dropzone.drag {
      border-color: rgba(111,158,124,0.55); background: var(--accent-dim);
    }
    .dropzone strong { display: block; font-size: 0.86rem; margin-bottom: 4px; }
    .dropzone span { font-size: 0.74rem; color: var(--muted); }
    .dropzone .file-name {
      margin-top: 8px; font-family: var(--mono); font-size: 0.72rem;
      color: var(--accent); word-break: break-all;
    }

    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .btn {
      appearance: none; border: 1px solid transparent; font: inherit;
      font-size: 0.84rem; font-weight: 600; padding: 10px 16px;
      border-radius: 11px; cursor: pointer; transition: 0.15s;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary {
      background: linear-gradient(180deg, #7eae8b, #5f8a6c); color: #0b0d10;
      box-shadow: 0 8px 24px rgba(111,158,124,0.28);
    }
    .btn-primary:hover:not(:disabled) { filter: brightness(1.05); }
    .btn-ghost {
      background: rgba(19,22,27,0.6); border-color: var(--border); color: var(--steel);
    }
    .btn-ghost:hover:not(:disabled) { border-color: var(--border-strong); color: var(--ink); }

    .status-bar {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.76rem; color: var(--muted); margin-top: 12px; min-height: 20px;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
    .dot.run { background: #c9a227; animation: pulse 1s infinite; }
    .dot.ok { background: var(--accent); }
    .dot.err { background: var(--danger); }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    .log-box {
      margin-top: 10px; font-family: var(--mono); font-size: 0.7rem;
      line-height: 1.45; color: var(--muted); max-height: 100px; overflow-y: auto;
      white-space: pre-wrap; padding: 8px 10px; border-radius: 9px;
      background: rgba(0,0,0,0.35); border: 1px solid var(--border);
    }
    .stats {
      display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px;
      font-size: 0.74rem; color: var(--muted);
    }
    .stats strong { color: var(--steel); font-weight: 600; }
  </style>
</head>
<body>
  <div class="bg-video" aria-hidden="true">
    <video id="bgVideo" autoplay muted loop playsinline>
      <source src="/static/bg.mp4" type="video/mp4" />
    </video>
    <div class="bg-overlay"></div>
  </div>

  <div class="app">
    <header class="top">
      <div class="brand">
        <div class="brand-mark">WX</div>
        <h1>WXZ Dump</h1>
      </div>
      <div class="right-tools">
        <button type="button" class="icon-btn" id="soundBtn" title="Toggle sound">🔇</button>
        <div class="badge live" id="serverBadge">● …</div>
      </div>
    </header>

    <section class="glass panel">
      <div class="row">
        <div>
          <label class="field-label">File</label>
          <div class="dropzone" id="dropzone">
            <strong>Drop or click</strong>
            <span>.lua · .luau · .txt</span>
            <div class="file-name" id="fileName" hidden></div>
            <input type="file" id="fileInput" accept=".lua,.luau,.txt,.obf" hidden />
          </div>
        </div>
        <div>
          <label class="field-label">URL</label>
          <input type="url" id="urlInput" placeholder="https://…/raw" />
        </div>
      </div>
    </section>

    <div class="row">
      <section class="glass panel">
        <div class="panel-title">
          <h2>Input</h2>
          <span id="inputMeta">0 B</span>
        </div>
        <textarea id="inputCode" placeholder="paste source…" spellcheck="false"></textarea>
        <div class="actions">
          <button type="button" class="btn btn-primary" id="runBtn">Run</button>
          <button type="button" class="btn btn-ghost" id="clearIn">Clear</button>
        </div>
        <div class="status-bar">
          <span class="dot" id="statusDot"></span>
          <span id="statusText">Ready</span>
        </div>
        <div class="log-box" id="logBox" hidden></div>
      </section>

      <section class="glass panel">
        <div class="panel-title">
          <h2>Output</h2>
          <span id="outputMeta">—</span>
        </div>
        <textarea id="outputCode" class="output" readonly placeholder="…" spellcheck="false"></textarea>
        <div class="actions">
          <button type="button" class="btn btn-ghost" id="copyOut">Copy</button>
          <button type="button" class="btn btn-ghost" id="downloadOut">Download</button>
          <button type="button" class="btn btn-ghost" id="clearOut">Clear</button>
        </div>
        <div class="stats" id="stats"></div>
      </section>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const state = { file: null, running: false };
    const video = $("bgVideo");

    // Sound: browsers block autoplay+audio — unmute on user click
    $("soundBtn").addEventListener("click", async () => {
      if (video.muted) {
        video.muted = false;
        try { await video.play(); } catch (_) {}
        $("soundBtn").textContent = "🔊";
        $("soundBtn").classList.add("on");
      } else {
        video.muted = true;
        $("soundBtn").textContent = "🔇";
        $("soundBtn").classList.remove("on");
      }
    });

    const dz = $("dropzone");
    const fileInput = $("fileInput");
    dz.addEventListener("click", () => fileInput.click());
    dz.addEventListener("dragover", (e) => { e.preventDefault(); dz.classList.add("drag"); });
    dz.addEventListener("dragleave", () => dz.classList.remove("drag"));
    dz.addEventListener("drop", (e) => {
      e.preventDefault(); dz.classList.remove("drag");
      if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener("change", () => {
      if (fileInput.files[0]) handleFile(fileInput.files[0]);
    });

    function handleFile(file) {
      state.file = file;
      $("fileName").hidden = false;
      $("fileName").textContent = file.name;
      const reader = new FileReader();
      reader.onload = () => { $("inputCode").value = reader.result; updateInputMeta(); };
      reader.readAsText(file);
    }

    function updateInputMeta() {
      const t = $("inputCode").value || "";
      $("inputMeta").textContent = formatBytes(new Blob([t]).size);
    }
    $("inputCode").addEventListener("input", updateInputMeta);

    $("clearIn").addEventListener("click", () => {
      $("inputCode").value = ""; state.file = null;
      $("fileName").hidden = true; $("urlInput").value = ""; updateInputMeta();
    });
    $("clearOut").addEventListener("click", () => {
      $("outputCode").value = ""; $("outputMeta").textContent = "—"; $("stats").innerHTML = "";
    });
    $("copyOut").addEventListener("click", async () => {
      if (!$("outputCode").value) return;
      await navigator.clipboard.writeText($("outputCode").value);
      setStatus("ok", "Copied");
    });
    $("downloadOut").addEventListener("click", () => {
      const t = $("outputCode").value; if (!t) return;
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([t], { type: "text/plain" }));
      a.download = "wxz_dump_out.lua"; a.click();
      URL.revokeObjectURL(a.href);
    });

    function formatBytes(n) {
      if (n < 1024) return n + " B";
      if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
      return (n / (1024 * 1024)).toFixed(2) + " MB";
    }
    function setStatus(kind, text) {
      $("statusDot").className = "dot" + (kind ? " " + kind : "");
      $("statusText").textContent = text;
    }
    function log(msg) {
      const box = $("logBox"); box.hidden = false;
      box.textContent += msg + "\n"; box.scrollTop = box.scrollHeight;
    }

    async function checkServer() {
      try {
        const j = await (await fetch("/health")).json();
        $("serverBadge").textContent = j.ok ? "● online" : "● down";
        $("serverBadge").classList.toggle("live", !!j.ok);
      } catch {
        $("serverBadge").textContent = "● offline";
        $("serverBadge").classList.remove("live");
      }
    }
    checkServer();
    setInterval(checkServer, 30000);

    /** One-time ticket: mint → dump once → server burns it (anti replay / F12 curl reuse). */
    async function mintTicket() {
      const r = await fetch("/api/ticket", { method: "POST" });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || ("ticket " + r.status));
      if (!j.ticket || !j.sig) throw new Error("bad ticket");
      return j;
    }

    $("runBtn").addEventListener("click", async () => {
      if (state.running) return;
      const code = $("inputCode").value.trim();
      const url = $("urlInput").value.trim();
      if (!code && !url && !state.file) {
        setStatus("err", "Need source");
        return;
      }
      state.running = true; $("runBtn").disabled = true;
      $("logBox").textContent = ""; $("logBox").hidden = false;
      setStatus("run", "Running…");

      try {
        const ticket = await mintTicket();
        const fd = new FormData();
        fd.append("ticket", ticket.ticket);
        fd.append("sig", ticket.sig);
        if (url) fd.append("url", url);
        if (code) fd.append("source", code);
        if (state.file) fd.append("file", state.file);

        const t0 = performance.now();
        const r = await fetch("/api/dump", {
          method: "POST",
          body: fd,
          headers: {
            "X-WXZ-Ticket": ticket.ticket,
            "X-WXZ-Sig": ticket.sig,
          },
        });
        const j = await r.json().catch(() => ({}));
        const ms = ((performance.now() - t0) / 1000).toFixed(2);
        if (j.log) log(j.log);

        if (r.status === 401) {
          setStatus("err", "ticket expired/used — try again");
          return;
        }
        if (!r.ok || j.error) {
          setStatus("err", j.error || ("HTTP " + r.status));
          if (j.output) $("outputCode").value = j.output;
          return;
        }
        $("outputCode").value = j.output || "";
        $("outputMeta").textContent = formatBytes(new Blob([j.output || ""]).size) + " · " + ms + "s";
        $("stats").innerHTML =
          `<span><strong>${j.engine || "string_dump"}</strong></span>` +
          `<span>${ms}s</span>` +
          (j.lines != null ? `<span>${j.lines} lines</span>` : "");
        setStatus("ok", "Done");
      } catch (err) {
        setStatus("err", String(err.message || err));
      } finally {
        state.running = false; $("runBtn").disabled = false;
      }
    });
  </script>
</body>
</html>
